# ============================================================
# discovery-engine — Master Configuration
# ============================================================
# All pipeline parameters live here. Never hardcode these
# values in source files — always import from config.yaml.
# ============================================================

# ── Project ───────────────────────────────────────────────────
project:
  name: "Google Photos Retrieval Discovery Engine"
  version: "1.0.0"
  language_scope: ["en"]          # ISO 639-1 codes to retain
  min_date: "2022-01-01"          # Ignore reviews older than this

# ── Ingestion Targets ─────────────────────────────────────────
ingestion:
  play_store:
    app_id: "com.google.android.apps.photos"
    target_count: 2000
    sort: "NEWEST"
    country: "us"
    lang: "en"

  app_store:
    app_id: "962194608"
    storefronts: ["us", "in"]
    target_count_per_storefront: 750

  reddit:
    apify_actor: "trudax/reddit-scraper"
    subreddits:
      - "googlephotos"
      - "AndroidQuestions"
      - "iphone"
    search_queries:
      - "google photos search can't find photo"
      - "google photos lost photos"
      - "find old photo google photos"
      - "google photos missing photos"
    max_items: 1000
    max_depth: 1                  # Only top-level comments (no nested replies)
    max_docs_per_thread: 20       # Cap per thread to avoid viral thread dominance

  community:
    apify_actor: "apify/website-content-crawler"
    start_url: "https://support.google.com/photos/community"
    max_crawl_pages: 300
    keywords: ["search", "find photos", "missing photos", "can't find"]

# ── Preprocessing ─────────────────────────────────────────────
preprocessing:
  min_text_length: 20             # Characters — discard shorter docs
  min_alpha_ratio: 0.5            # Min fraction of alphabetic chars
  langdetect_confidence: 0.9      # Minimum confidence to trust language detection
  max_tokens_per_chunk: 512       # Max tokens per embedding chunk
  relevance_model: "openai/gpt-oss-20b"   # Groq model for relevance classification
  target_relevant_docs: 1500      # Minimum post-filtering corpus size

# ── Embedding ─────────────────────────────────────────────────
embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"   # Local, free
  # Upgrade option: "text-embedding-3-small" (requires OPENAI_API_KEY)
  batch_size: 64
  dimension: 384                  # all-MiniLM-L6-v2 output dimension

# ── AI Analysis (Groq) ────────────────────────────────────────
analysis:
  tagging_model: "openai/gpt-oss-120b"    # High-quality tagging
  temperature: 0.1                             # Near-deterministic for structured output
  max_retries: 3                               # Retries on malformed JSON response
  max_tokens_per_prompt: 7500                  # Safety buffer below 8K context window
  min_confidence_threshold: 0.6               # Flag below this for review

  retrieval_types:
    - event_based
    - person_based
    - location_based
    - object_based
    - time_based
    - emotion_based
    - unknown

  failure_modes:
    - search_vocabulary_mismatch
    - temporal_ambiguity
    - location_imprecision
    - no_album_structure
    - visual_only_memory
    - search_ux_breakdown
    - wrong_confidence_signal
    - data_loss                   # Different problem — route separately
    - unknown

  search_behaviors:
    - approximate_date_browsing
    - keyword_guessing
    - album_scanning
    - asked_someone_else
    - gave_up
    - used_third_party_tool
    - unknown_browsing

# ── Clustering ────────────────────────────────────────────────
clustering:
  umap:
    n_components_cluster: 10      # Dimensions for HDBSCAN
    n_components_viz: 2           # Dimensions for 2D scatter plot
    n_neighbors: 15
    min_dist: 0.1
    metric: "cosine"
    low_memory: true

  hdbscan:
    min_cluster_size: 20          # Lower value for smaller corpus (1,500 docs)
    min_samples: 5
    metric: "euclidean"

  post_processing:
    merge_similarity_threshold: 0.92   # Merge near-duplicate cluster centroids
    max_noise_rate: 0.40               # Alert if > 40% docs labelled as noise (-1)
    top_representative_docs: 20        # Docs fed to LLM for cluster labeling
    labeling_model: "openai/gpt-oss-120b"

# ── Opportunity Scoring ───────────────────────────────────────
scoring:
  weights:
    volume: 0.40
    severity: 0.40
    novelty: 0.20
  severity_rating_threshold: 2    # Ratings ≤ this count as "severe"
  known_features_file: "data/known_features.json"

# ── Output ────────────────────────────────────────────────────
output:
  top_clusters_for_reports: 10
  min_evidence_per_cluster: 3     # Skip report generation if cluster has fewer quotes
  dashboard_port: 8501

# ── Database ──────────────────────────────────────────────────
database:
  pool_size: 5
  max_overflow: 10
  echo: false                     # Set true to log all SQL (debug only)
